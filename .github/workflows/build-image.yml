# Build the image from containers/hpv and push it to GitHub Container Registry.
# Runs when the image definition changes on main, or by hand (Actions tab > Run workflow).
# Pin the pushed digest (shown in the run summary) in config.sh.
name: Build image

on:
  push:
    branches: [main]
    paths: ["containers/hpv/Dockerfile", "containers/hpv/environment.yml", "containers/hpv/install_packages.R",
            "containers/hpv/smoke_test.sh", "containers/hpv/VERSION"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/boberrey/hpv-project-env

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read image version
        id: version
        run: echo "version=$(cat containers/hpv/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: containers/hpv
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Summary
        run: |
          echo "Pushed \`${IMAGE}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
